/* ==================================================================
   Programa de reconocimiento por puntos
   - Coordinación: otorga puntos, administra premios, entrega canjes
   - Colaborador: consulta su saldo, ve el catálogo y canjea
   El saldo nunca se almacena: se calcula sumando los movimientos.
   ================================================================== */

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

.rec {
  --verde:#06302B; --verde-2:#0B463D;
  --oro:#AF862E; --oro-claro:#D9BE79; --arena:#E9DCC5;
  --fondo:#F7F4EC; --panel:#FFFFFF; --gris:#4A4F55;
  --ink:#1B2321; --soft:#6C7571;
  --linea:#DFD8C8; --linea-2:#C6BDA9;
  --exito:#1F6B4A; --alerta:#8E3B2F;
  --ui:'Figtree',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  background:var(--fondo); color:var(--ink); font-family:var(--ui);
  min-height:100vh; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.rec *{box-sizing:border-box;}
.rec button{font-family:inherit;cursor:pointer;}
.rec input,.rec select,.rec textarea{font-family:inherit;font-size:14.5px;}
.rec :focus-visible{outline:2px solid var(--verde);outline-offset:2px;}
.rec h1,.rec h2,.rec h3{font-family:var(--ui);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.011em;}
.rec .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.rec .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* ---------- estructura ---------- */
.rec .wrap{max-width:1160px;margin:0 auto;padding:0 24px;}
.rec .barra{background:var(--verde);}
.rec .barra-in{max-width:1160px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;}
.rec .logo{height:34px;width:auto;display:block;flex:none;}
.rec .barra-sep{width:1px;height:26px;background:rgba(233,220,197,.28);flex:none;}
.rec .programa{font-weight:600;font-size:16px;letter-spacing:-.01em;margin-right:auto;color:#EDE7DA;}
.rec .quien{font-size:13.5px;color:#A9B5B0;}
.rec .salir{background:transparent;border:1px solid rgba(233,220,197,.32);color:#EDE7DA;padding:7px 13px;border-radius:2px;font-size:13px;font-weight:500;}
.rec .salir:hover{border-color:var(--oro);color:var(--oro-claro);}

.rec .menu{background:var(--verde-2);border-bottom:2px solid var(--oro);overflow-x:auto;}
.rec .menu-in{max-width:1160px;margin:0 auto;padding:0 24px;display:flex;width:100%;}
.rec .menu button{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 16px;font-size:14px;font-weight:500;color:#A9B5B0;white-space:nowrap;}
.rec .menu button:hover{color:#EDE7DA;}
.rec .menu button[aria-current="true"]{color:#FFFFFF;font-weight:700;border-bottom-color:var(--oro-claro);}

/* ---------- tablero de saldo ---------- */
.rec .tablero{background:var(--verde);color:#EDE7DA;border-radius:3px;margin:22px 0 20px;
  display:grid;grid-template-columns:1.25fr 1fr;overflow:hidden;}
.rec .tablero-main{padding:24px 26px 22px;border-right:1px solid rgba(233,220,197,.17);}
.rec .rot{font-size:13px;color:#A9B5B0;display:block;margin-bottom:2px;}
.rec .saldo-num{font-family:var(--mono);font-weight:600;font-size:clamp(46px,8vw,66px);
  line-height:1;letter-spacing:-.035em;color:var(--oro-claro);}
.rec .rail{margin-top:18px;}
.rec .rail-barra{height:7px;background:rgba(233,220,197,.18);border-radius:1px;overflow:hidden;}
.rec .rail-barra span{display:block;height:100%;background:var(--oro);border-radius:1px;}
.rec .rail-txt{display:block;margin-top:8px;font-size:13px;color:#A9B5B0;}
.rec .rail-txt b{color:#EDE7DA;font-weight:600;}
.rec .tablero-datos{display:grid;margin:0;}
.rec .tablero-datos > div{padding:15px 24px;border-bottom:1px solid rgba(233,220,197,.17);display:flex;justify-content:space-between;align-items:baseline;gap:14px;}
.rec .tablero-datos > div:last-child{border-bottom:none;}
.rec .tablero-datos dt{font-size:13.5px;color:#A9B5B0;margin:0;}
.rec .tablero-datos dd{margin:0;font-family:var(--mono);font-size:19px;font-weight:500;}

/* ---------- botones ---------- */
.rec .b{border:1px solid var(--verde);background:var(--verde);color:#F7F4EC;padding:9px 16px;border-radius:2px;font-size:14px;font-weight:600;}
.rec .b:hover{background:var(--verde-2);border-color:var(--verde-2);}
.rec .b.oro{background:var(--oro);border-color:var(--oro);color:#241B06;}
.rec .b.oro:hover{background:#9A7526;border-color:#9A7526;color:#fff;}
.rec .b.hueco{background:var(--panel);color:var(--verde);border-color:var(--linea-2);}
.rec .b.hueco:hover{background:var(--panel);border-color:var(--verde);}
.rec .b.peligro{background:var(--panel);color:var(--alerta);border-color:#D9B6AE;}
.rec .b.peligro:hover{background:var(--alerta);border-color:var(--alerta);color:#fff;}
.rec .b.chico{padding:6px 11px;font-size:12.5px;}
.rec .b:disabled{background:var(--panel);border-color:var(--linea);color:#A9A396;cursor:not-allowed;}
.rec .b:disabled:hover{background:var(--panel);border-color:var(--linea);color:#A9A396;}

/* ---------- paneles ---------- */
.rec .bloque{background:var(--panel);border:1px solid var(--linea);border-radius:3px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(6,48,43,.05);}
.rec .bloque > h2{font-size:19px;margin-bottom:3px;}
.rec .bloque > .pie{font-size:13.5px;color:var(--soft);margin:0 0 18px;max-width:72ch;}
.rec .cifras{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(182px,1fr));margin-bottom:16px;}
.rec .cifra{background:var(--panel);border:1px solid var(--linea);border-radius:3px;padding:15px 16px;box-shadow:0 1px 2px rgba(6,48,43,.05);}
.rec .cifra b{display:block;font-family:var(--mono);font-size:27px;font-weight:500;line-height:1.05;letter-spacing:-.03em;margin-bottom:5px;color:var(--verde);}
.rec .cifra span{font-size:13px;color:var(--soft);}
.rec .cifra.ojo{border-left:3px solid var(--oro);}
.rec .cifra.ojo b{color:var(--oro);}

/* ---------- tablas ---------- */
.rec .scroll{overflow-x:auto;}
.rec table{width:100%;border-collapse:collapse;font-size:14px;}
.rec th{text-align:left;font-size:12.5px;font-weight:600;color:#EDE7DA;background:var(--verde);padding:10px 12px;white-space:nowrap;}
.rec td{padding:11px 12px;border-bottom:1px solid var(--linea);vertical-align:middle;}
.rec tbody tr:last-child td{border-bottom:none;}
.rec tbody tr:hover{background:#FBF9F3;}
.rec .der{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
/* Encabezado que ordena la tabla al presionarlo. */
.rec th .orden{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;
  display:inline-flex;align-items:center;gap:6px;}
.rec th .orden:hover{color:var(--oro-claro);}
.rec th.der .orden{flex-direction:row-reverse;}
.rec th .flecha{font-size:8.5px;line-height:1;opacity:.55;}
.rec th .flecha.viva{opacity:1;color:var(--oro-claro);}
.rec .mas{color:var(--exito);font-weight:600;}
.rec .menos{color:var(--alerta);font-weight:600;}
.rec .etq{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:500;padding:2px 8px;border:1px solid;border-radius:2px;white-space:nowrap;}
.rec .etq.esp{color:#8A6A1F;border-color:var(--oro-claro);background:#FBF4E4;}
.rec .etq.list{color:var(--exito);border-color:#A8CDBA;background:#EFF7F2;}
.rec .etq.no{color:var(--alerta);border-color:#D9B6AE;background:#FBF0ED;}
.rec .etq.gris{color:var(--soft);border-color:var(--linea-2);background:#FAF8F2;}

/* ---------- tarjetas de premio, con forma de etiqueta de despacho ---------- */
.rec .tiquetes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));}
.rec .tk{background:var(--panel);border:1px solid var(--linea);border-radius:3px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 2px rgba(6,48,43,.05);}
.rec .tk-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--linea);background:#FBF9F3;}
.rec .tk-ref{font-size:11.5px;color:var(--soft);letter-spacing:.02em;}
.rec .tk-cat{font-size:11.5px;color:var(--soft);}

.rec .tk-accion{border-radius:0;border:none;border-top:1px solid var(--linea);width:100%;}

.rec .tk.agotado{opacity:.62;}
.rec .falta{color:var(--soft);}

.rec .campo{display:flex;flex-direction:column;gap:5px;margin-bottom:15px;}
.rec .campo label{font-size:13.5px;font-weight:600;}
.rec .campo input,.rec .campo select,.rec .campo textarea{padding:9px 11px;border:1px solid var(--linea-2);border-radius:2px;background:var(--panel);width:100%;color:var(--ink);}
.rec .campo input:focus,.rec .campo select:focus,.rec .campo textarea:focus{border-color:var(--verde);}
.rec .dos{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
.rec .tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 18px;}
.rec .gente{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));max-height:236px;overflow-y:auto;border:1px solid var(--linea-2);border-radius:2px;padding:10px 12px;background:var(--panel);}
.rec .gente label{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;padding:4px 0;}
.rec .gente label span{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--soft);}
.rec .sugerido{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px;}
.rec .sugerido button{border:1px solid var(--linea-2);background:var(--panel);padding:5px 12px;border-radius:2px;font-family:var(--mono);font-size:12.5px;color:var(--verde);}
.rec .sugerido button:hover{border-color:var(--oro);background:#FBF4E4;}

/* ---------- entrada ---------- */
.rec .entrada{min-height:100vh;display:grid;place-items:center;padding:28px 20px;background:var(--fondo);}
.rec .caja{width:min(420px,100%);}
.rec .caja .logo{height:40px;margin:0 auto 26px;}
.rec .caja h1{font-size:25px;margin-bottom:20px;text-align:center;}
.rec .caja .form{background:var(--panel);border:1px solid var(--linea);border-radius:3px;padding:24px;box-shadow:0 2px 10px rgba(6,48,43,.07);}
.rec .mal{color:var(--alerta);font-size:13.5px;font-weight:600;margin:0 0 12px;}
.rec .claves{margin-top:18px;font-size:12.5px;color:var(--soft);border-top:1px solid var(--linea);padding-top:14px;line-height:1.6;}

/* ====================== utilidades ====================== */

const hash = t => {
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = (h << 5) + h + t.charCodeAt(i) >>> 0;
  return String(h);
};
const id = () => Math.random().toString(36).slice(2, 10);
/* Orden alfabético en español: la ñ y los acentos quedan donde corresponde. */
const porNombre = (a, b) => a.nombre.localeCompare(b.nombre, "es", {
  sensitivity: "base"
});
/* Separador de miles con punto, como se escribe en Costa Rica. */
const miles = n => {
  const x = Math.round(Number(n) || 0);
  return (x < 0 ? "-" : "") + Math.abs(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
};
const hoy = () => new Date().toISOString().slice(0, 10);
const fecha = iso => new Date(iso).toLocaleDateString("es-CR", {
  day: "2-digit",
  month: "short",
  year: "2-digit"
});
const fechaHora = iso => new Date(iso).toLocaleDateString("es-CR", {
  day: "2-digit",
  month: "short"
}) + ", " + new Date(iso).toLocaleTimeString("es-CR", {
  hour: "2-digit",
  minute: "2-digit"
});
const codigo = () => {
  const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 6; i++) c += letras[Math.floor(Math.random() * letras.length)];
  return c.slice(0, 3) + "-" + c.slice(3);
};
const csv = (nombre, filas) => {
  const t = filas.map(f => f.map(c => `"${String(c !== null && c !== void 0 ? c : "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob(["\ufeff" + t], {
    type: "text/csv;charset=utf-8;"
  }));
  const a = document.createElement("a");
  a.href = url;
  a.download = nombre;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
};

/** Reduce la foto a 700 px y la comprime, para que quepa en el almacenamiento. */
const comprimirImagen = file => new Promise((ok, mal) => {
  const fr = new FileReader();
  fr.onerror = () => mal(new Error("lectura"));
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => mal(new Error("imagen"));
    im.onload = () => {
      const max = 700;
      const esc = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(im.width * esc);
      cv.height = Math.round(im.height * esc);
      const cx = cv.getContext("2d");
      cx.fillStyle = "var(--arena-claro)";
      cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(im, 0, 0, cv.width, cv.height);
      ok(cv.toDataURL("image/jpeg", 0.74));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
});

const correoDe = usuario => `${String(usuario || "").trim().toLowerCase()}@${SUPABASE.dominio}`;
const nubeSupabase = {
  sesion: null,
  get activa() {
    return !!(SUPABASE.url && SUPABASE.clave);
  },
  get usuario() {
    return this.sesion ? this.sesion.usuario : null;
  },
  /* En Supabase hay que crear la entrada de cada persona una vez. */
  get necesitaCuentas() {
    return true;
  },
  /* ---------- lo básico ---------- */

  async pedir(ruta, opciones = {}, conSesion = true) {
    if (!this.activa) throw new Error("La base compartida no está configurada");
    const token = conSesion && this.sesion ? this.sesion.access_token : SUPABASE.clave;
    let r;
    try {
      r = await fetch(SUPABASE.url + ruta, _objectSpread(_objectSpread({}, opciones), {}, {
        headers: _objectSpread({
          apikey: SUPABASE.clave,
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        }, opciones.headers || {})
      }));
    } catch (e) {
      const err = new Error("Sin conexión");
      err.sinRed = true;
      throw err;
    }
    const texto = await r.text();
    let cuerpo = null;
    try {
      cuerpo = texto ? JSON.parse(texto) : null;
    } catch (_unused) {
      cuerpo = texto;
    }
    if (!r.ok) {
      const m = cuerpo && typeof cuerpo === "object" ? cuerpo.message || cuerpo.msg || cuerpo.error_description || cuerpo.error || cuerpo.hint : null;
      const err = new Error(m || `Error ${r.status}`);
      err.estado = r.status;
      throw err;
    }
    return cuerpo;
  },
  /* ---------- entrar y salir ---------- */

  guardarSesion(s) {
    this.sesion = s;
    try {
      if (s) localStorage.setItem(LLAVE_SESION, JSON.stringify(s));else localStorage.removeItem(LLAVE_SESION);
    } catch (_unused2) {/* en modo privado puede fallar; no es grave */}
  },
  recuperarSesion() {
    try {
      const t = localStorage.getItem(LLAVE_SESION);
      if (t) this.sesion = JSON.parse(t);
    } catch (_unused3) {
      this.sesion = null;
    }
    return this.sesion;
  },
  async entrar(usuario, clave) {
    const d = await this.pedir("/auth/v1/token?grant_type=password", {
      method: "POST",
      body: JSON.stringify({
        email: correoDe(usuario),
        password: clave
      })
    }, false);
    this.guardarSesion({
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      vence: Date.now() + (d.expires_in || 3600) * 1000,
      usuario: String(usuario).trim()
    });
    return this.sesion;
  },
  salir() {
    this.guardarSesion(null);
  },
  /* El permiso de entrada vence cada hora; se renueva antes de que pase. */
  async alDia() {
    if (!this.sesion) return false;
    if (Date.now() < this.sesion.vence - 120000) return true;
    try {
      const d = await this.pedir("/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        body: JSON.stringify({
          refresh_token: this.sesion.refresh_token
        })
      }, false);
      this.guardarSesion({
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        vence: Date.now() + (d.expires_in || 3600) * 1000,
        usuario: this.sesion.usuario
      });
      return true;
    } catch (e) {
      if (e.sinRed) return true; /* sin red, se reintenta después */
      this.salir();
      return false;
    }
  },
  /* ---------- el documento compartido ---------- */

  async leer() {
    if (!(await this.alDia())) throw new Error("Su sesión venció. Vuelva a entrar.");
    const f = await this.pedir("/rest/v1/sm_estado?id=eq.1&select=datos,version");
    /* Sin filas puede ser que la persona no esté en la lista del programa (los
       permisos de la base le esconden todo) o que falte preparar la base. */
    if (!f || !f.length) throw new Error("No se pudo leer el programa. Puede ser que su usuario no esté en la lista del " + "programa, o que falte correr el script de preparación en Supabase.");
    return {
      datos: f[0].datos,
      version: f[0].version
    };
  },
  async versionActual() {
    if (!(await this.alDia())) return null;
    const f = await this.pedir("/rest/v1/sm_estado?id=eq.1&select=version");
    return f && f.length ? f[0].version : null;
  },
  /* Graba solo si nadie cambió el documento mientras tanto. Devuelve null
     cuando otra persona se adelantó, para volver a intentar sobre lo suyo. */
  async grabar(datos, version) {
    if (!(await this.alDia())) throw new Error("Su sesión venció. Vuelva a entrar.");
    const f = await this.pedir(`/rest/v1/sm_estado?id=eq.1&version=eq.${version}`, {
      method: "PATCH",
      headers: {
        Prefer: "return=representation"
      },
      body: JSON.stringify({
        datos,
        version: version + 1,
        actualizado: new Date().toISOString(),
        actualizado_por: this.usuario || ""
      })
    });
    if (!f || !f.length) return null;
    return {
      datos: f[0].datos,
      version: f[0].version
    };
  },
  async anotar(version, accion) {
    try {
      await this.pedir("/rest/v1/sm_bitacora", {
        method: "POST",
        headers: {
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          version,
          usuario: (this.usuario || "").toLowerCase(),
          accion: String(accion).slice(0, 300)
        })
      });
    } catch (_unused4) {/* la bitácora nunca debe frenar el trabajo */}
  },
  /* ---------- fotos de los premios ---------- */

  async leerFotos() {
    const f = await this.pedir("/rest/v1/sm_imagenes?select=premio,dato");
    const m = {};
    (f || []).forEach(x => {
      m[x.premio] = x.dato;
    });
    return m;
  },
  async grabarFoto(premio, dato) {
    await this.pedir("/rest/v1/sm_imagenes", {
      method: "POST",
      headers: {
        Prefer: "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify({
        premio,
        dato,
        actualizado: new Date().toISOString()
      })
    });
  },
  async borrarFoto(premio) {
    await this.pedir(`/rest/v1/sm_imagenes?premio=eq.${encodeURIComponent(premio)}`, {
      method: "DELETE",
      headers: {
        Prefer: "return=minimal"
      }
    });
  },
  /* ---------- contraseñas y cuentas ---------- */

  async cambiarMiClave(nueva) {
    if (!(await this.alDia())) throw new Error("Su sesión venció. Vuelva a entrar.");
    await this.pedir("/auth/v1/user", {
      method: "PUT",
      body: JSON.stringify({
        password: nueva
      })
    });
  },
  /* Crea la cuenta de entrada de una persona nueva. No cambia la sesión
     de quien la está creando. */
  async crearCuenta(usuario, clave) {
    await this.pedir("/auth/v1/signup", {
      method: "POST",
      body: JSON.stringify({
        email: correoDe(usuario),
        password: clave
      })
    }, false);
  },
  /* Solo coordinación: le pone una contraseña nueva a quien la olvidó. */
  async reponerClave(usuario, clave) {
    if (!(await this.alDia())) throw new Error("Su sesión venció. Vuelva a entrar.");
    await this.pedir("/rest/v1/rpc/sm_reponer_clave", {
      method: "POST",
      body: JSON.stringify({
        p_usuario: String(usuario).trim(),
        p_clave: clave
      })
    });
  }
};

/* ====================== la misma base, pero en Google Drive ======================

   Aquí la contraseña la revisa el script que corre en la cuenta de Google:
   la página nunca recibe contraseñas y sin haber entrado no obtiene nada.
   Tiene la misma forma que el de Supabase, para que el resto de la
   aplicación no tenga que saber cuál de los dos está puesto.               */

const LLAVE_SESION_G = "reconoce:sesion-google:v1";
const nubeGoogle = {
  sesion: null,
  get activa() {
    return !!GOOGLE.url;
  },
  get usuario() {
    return this.sesion ? this.sesion.usuario : null;
  },
  /* Las contraseñas las siembra el primer arranque del script. */
  get necesitaCuentas() {
    return false;
  },
  /* Texto plano a propósito: con JSON el navegador pide permiso previo y
     Apps Script no sabe contestarlo. El contenido sigue siendo JSON. */
  async pedir(cuerpo) {
    let r;
    try {
      r = await fetch(GOOGLE.url, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(cuerpo)
      });
    } catch (e) {
      const err = new Error("Sin conexión");
      err.sinRed = true;
      throw err;
    }
    const texto = await r.text();
    let d = null;
    try {
      d = texto ? JSON.parse(texto) : null;
    } catch (_unused5) {
      d = null;
    }
    if (!r.ok || !d) throw new Error(`No se pudo hablar con la base (${r.status})`);
    if (d.error) throw new Error(d.error);
    return d;
  },
  guardarSesion(s) {
    this.sesion = s;
    try {
      if (s) localStorage.setItem(LLAVE_SESION_G, JSON.stringify(s));else localStorage.removeItem(LLAVE_SESION_G);
    } catch (_unused6) {/* en modo privado puede fallar; no es grave */}
  },
  recuperarSesion() {
    try {
      const t = localStorage.getItem(LLAVE_SESION_G);
      if (t) this.sesion = JSON.parse(t);
    } catch (_unused7) {
      this.sesion = null;
    }
    if (this.sesion && this.sesion.vence < Date.now()) this.sesion = null;
    return this.sesion;
  },
  /* Si el script devuelve el programa junto con la entrada, se guarda aquí y
     la aplicación no tiene que pedirlo aparte: entrar queda en un solo viaje.
     Con un script viejo llega vacío y todo sigue funcionando como antes. */
  reciente: null,
  /* Número de versión que informa el script, para saber si la publicación
     nueva ya quedó activa. Los scripts viejos no lo mandan. */
  v: null,
  async entrar(usuario, clave) {
    const d = await this.pedir({
      accion: "entrar",
      usuario,
      clave
    });
    this.v = typeof d.v === "number" ? d.v : 1;
    this.guardarSesion({
      token: d.token,
      vence: d.vence,
      usuario: d.usuario
    });
    this.reciente = d.datos && typeof d.version === "number" ? {
      datos: d.datos,
      version: d.version
    } : null;
    return this.sesion;
  },
  /** Entrega una sola vez lo que vino con la entrada. */
  tomarReciente() {
    const r = this.reciente;
    this.reciente = null;
    return r;
  },
  salir() {
    const t = this.sesion && this.sesion.token;
    this.reciente = null;
    this.guardarSesion(null);
    if (t) this.pedir({
      accion: "salir",
      token: t
    }).catch(() => {});
  },
  alDia() {
    return Promise.resolve(!!(this.sesion && this.sesion.vence > Date.now()));
  },
  async leer() {
    const d = await this.pedir({
      accion: "leer",
      token: this.sesion && this.sesion.token
    });
    return {
      datos: d.datos,
      version: d.version
    };
  },
  async versionActual() {
    const d = await this.pedir({
      accion: "version",
      token: this.sesion && this.sesion.token
    });
    return d.version;
  },
  /* Devuelve null cuando otra persona se adelantó, igual que el de Supabase.
     Si va una cuenta de entrada, el script la crea en el mismo viaje y avisa
     con cuentaLista; un script viejo la ignora y la aplicación la crea aparte. */
  async grabar(datos, version, nota, cuenta) {
    const d = await this.pedir({
      accion: "grabar",
      token: this.sesion && this.sesion.token,
      datos,
      version,
      nota,
      cuenta: cuenta || null
    });
    if (d.conflicto) return null;
    return {
      datos: d.datos,
      version: d.version,
      cuentaLista: !!d.cuentaLista
    };
  },
  /* El script anota solo, al grabar: aquí no hay nada que mandar aparte. */
  anotar() {},
  async leerFotos() {
    const d = await this.pedir({
      accion: "leerFotos",
      token: this.sesion && this.sesion.token
    });
    return d.fotos || {};
  },
  async grabarFoto(premio, dato) {
    await this.pedir({
      accion: "grabarFoto",
      token: this.sesion && this.sesion.token,
      premio,
      dato
    });
  },
  async borrarFoto(premio) {
    await this.pedir({
      accion: "borrarFoto",
      token: this.sesion && this.sesion.token,
      premio
    });
  },
  async cambiarMiClave(nueva, actual) {
    await this.pedir({
      accion: "cambiarClave",
      token: this.sesion && this.sesion.token,
      actual,
      nueva
    });
  },
  async crearCuenta(usuario, clave) {
    const d = await this.pedir({
      accion: "crearCuenta",
      token: this.sesion && this.sesion.token,
      usuario,
      clave
    });
    if (d.yaTenia) {
      const e = new Error("User already registered");
      throw e;
    }
  },
  async reponerClave(usuario, clave) {
    await this.pedir({
      accion: "reponerClave",
      token: this.sesion && this.sesion.token,
      usuario,
      clave
    });
  }
};

/* Se usa el que esté configurado. Si no hay ninguno, cada persona trabaja
   sobre su propia copia en el navegador, como al principio. */
const nube = GOOGLE.url ? nubeGoogle : nubeSupabase;

/* Describe en una línea qué cambió, para dejarlo anotado en la bitácora.
   Se saca comparando antes y después: así ninguna pantalla tiene que avisar. */
function resumirCambio(antes, despues) {
  if (!antes) return "Cambios en el programa";
  const partes = [];
  const cuenta = lista => Array.isArray(lista) ? lista.length : 0;
  [["nominaciones", "nominación", "nominaciones"], ["votos", "voto", "votos"], ["canjes", "canje", "canjes"], ["movimientos", "movimiento de puntos", "movimientos de puntos"], ["ciclos", "mes", "meses"], ["premios", "premio", "premios"], ["personas", "persona", "personas"]].forEach(([llave, uno, varios]) => {
    const d = cuenta(despues[llave]) - cuenta(antes[llave]);
    if (d > 0) partes.push(`${d} ${d === 1 ? uno : varios} más`);else if (d < 0) partes.push(`${-d} ${-d === 1 ? uno : varios} menos`);
  });
  if (!partes.length) {
    if (JSON.stringify(antes.config) !== JSON.stringify(despues.config)) return "Cambió los ajustes";
    if (JSON.stringify(antes.personas) !== JSON.stringify(despues.personas)) return "Cambió datos de personas";
    if (JSON.stringify(antes.premios) !== JSON.stringify(despues.premios)) return "Cambió el catálogo de premios";
    if (JSON.stringify(antes.canjes) !== JSON.stringify(despues.canjes)) return "Cambió el estado de un canje";
    if (JSON.stringify(antes.ciclos) !== JSON.stringify(despues.ciclos)) return "Cambió un mes";
    return "Cambios en el programa";
  }
  return partes.join(", ");
}
